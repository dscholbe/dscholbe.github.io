<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Race Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .track {
            background: #90EE90;
            border: 3px solid #228B22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .lane {
            display: flex;
            align-items: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }
        .horse-name {
            width: 150px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .race-path {
            flex: 1;
            height: 40px;
            background: linear-gradient(to right, #fff 0%, #fff 98%, #ff4444 98%, #ff4444 100%);
            border: 2px solid #666;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .horse {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            transition: left 0.1s linear;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .winner-announcement {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 20px;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎅 Secret Santa Race – Official Playback 🎅</h1>

        <div class="track" id="track">
            <div class="lane"><div class="horse-name">Andy</div><div class="race-path"><div class="horse" id="horse1">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Dad / Uncle Chris</div><div class="race-path"><div class="horse" id="horse2">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Dawson</div><div class="race-path"><div class="horse" id="horse3">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Donny</div><div class="race-path"><div class="horse" id="horse4">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Katherine</div><div class="race-path"><div class="horse" id="horse5">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Linda</div><div class="race-path"><div class="horse" id="horse6">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Maggie</div><div class="race-path"><div class="horse" id="horse7">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Mom / Me Tuan</div><div class="race-path"><div class="horse" id="horse8">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Owain</div><div class="race-path"><div class="horse" id="horse9">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Xuyen</div><div class="race-path"><div class="horse" id="horse10">🎅</div></div></div>
        </div>

        <div class="controls">
            <button onclick="togglePlayback()">Play / Pause</button>
        </div>

        <div class="winner-announcement" id="winner"></div>
    </div>

    <script>
        let raceData = null;
        let step = 0;
        let isPlaying = false;
        let playbackInterval = null;

        const horses = {
            "horse1": 0,
            "horse2": 0,
            "horse3": 0,
            "horse4": 0,
            "horse5": 0,
            "horse6": 0,
            "horse7": 0,
            "horse8": 0,
            "horse9": 0,
            "horse10": 0
        };

        async function loadRace() {
            const response = await fetch("official_race_data.json");
            raceData = await response.json();
        }

        function applyFrame() {
            if (!raceData) return;

            const movements = raceData.movements[step];
            if (!movements) {
                endRace();
                return;
            }

            movements.forEach(m => {
                horses[m.id] += m.move;
                document.getElementById(m.id).style.left =
                    Math.min(horses[m.id], 95) + "%";
            });

            step++;
        }

        function startPlayback() {
            if (playbackInterval) return;

            playbackInterval = setInterval(applyFrame, 50);
        }

        function pausePlayback() {
            clearInterval(playbackInterval);
            playbackInterval = null;
        }

        function togglePlayback() {
            isPlaying = !isPlaying;

            if (isPlaying) startPlayback();
            else pausePlayback();
        }

        function endRace() {
            pausePlayback();

            const winner = raceData.finishOrder[0];
            document.getElementById("winner").textContent =
                `🏆 ${winner.name} wins the official race!`;
        }

        // Start loading immediately
        loadRace();
    </script>

</body>
</html>
