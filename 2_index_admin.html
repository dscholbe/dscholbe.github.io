<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Race Randomizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .admin-reset {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1000;
        }
        .admin-reset:hover {
            background: rgba(220, 53, 69, 1);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .track {
            background: #90EE90;
            border: 3px solid #228B22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .lane {
            display: flex;
            align-items: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }
        .horse-name {
            width: 150px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .race-path {
            flex: 1;
            height: 40px;
            background: linear-gradient(to right, #fff 0%, #fff 98%, #ff4444 98%, #ff4444 100%);
            border: 2px solid #666;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .horse {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            transition: left 0.1s linear;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .winner-announcement {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 20px;
            min-height: 30px;
        }
        .results {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        .results.show {
            display: block;
        }
        .results h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .result-item.first {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            font-weight: bold;
        }
        .result-item.second {
            background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%);
            font-weight: bold;
        }
        .result-item.third {
            background: linear-gradient(135deg, #CD7F32 0%, #B8860B 100%);
            font-weight: bold;
        }
        .place {
            font-size: 24px;
            font-weight: bold;
            width: 60px;
            text-align: center;
        }
        .horse-result-name {
            flex: 1;
            font-size: 18px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .race-log {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        .race-log h3 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .log-entry {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .log-entry.finished {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        .standing-place {
            font-weight: bold;
            width: 50px;
            font-size: 18px;
            color: #667eea;
        }
        .standing-name {
            flex: 1;
            font-size: 16px;
        }
        .standing-distance {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <button class="admin-reset" onclick="adminPanel()">🔐 Admin</button>
    
    <div class="container">
        <h1>🎅 Secret Santa Race Randomizer 🎅</h1>
        
        <div class="track" id="track">
            <div class="lane">
                <div class="horse-name">Andy</div>
                <div class="race-path">
                    <div class="horse" id="horse1">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Dad / Uncle Chris</div>
                <div class="race-path">
                    <div class="horse" id="horse2">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Dawson</div>
                <div class="race-path">
                    <div class="horse" id="horse3">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Donny</div>
                <div class="race-path">
                    <div class="horse" id="horse4">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Katherine</div>
                <div class="race-path">
                    <div class="horse" id="horse5">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Linda</div>
                <div class="race-path">
                    <div class="horse" id="horse6">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Maggie</div>
                <div class="race-path">
                    <div class="horse" id="horse7">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Mom / Me Tuan</div>
                <div class="race-path">
                    <div class="horse" id="horse8">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Owain</div>
                <div class="race-path">
                    <div class="horse" id="horse9">🎅</div>
                </div>
            </div>
            <div class="lane">
                <div class="horse-name">Xuyen</div>
                <div class="race-path">
                    <div class="horse" id="horse10">🎅</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="viewBtn" onclick="viewRace()" style="display: none;">View Race</button>
        </div>

        <div class="winner-announcement" id="winner"></div>

        <div class="race-log" style="display: none;" id="raceLog">
            <h3>📊 Current Standings</h3>
            <div id="logEntries">
                <div style="color: #666; font-style: italic; text-align: center;">Race not started yet...</div>
            </div>
        </div>

        <div class="results" id="results"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="raceCount">0</div>
                <div>Races Run</div>
            </div>
        </div>
    </div>

    <script>
        const horses = [
            { id: 'horse1', name: 'Andy', position: 0 },
            { id: 'horse2', name: 'Dad / Uncle Chris', position: 0 },
            { id: 'horse3', name: 'Dawson', position: 0 },
            { id: 'horse4', name: 'Donny', position: 0 },
            { id: 'horse5', name: 'Katherine', position: 0 },
            { id: 'horse6', name: 'Linda', position: 0 },
            { id: 'horse7', name: 'Maggie', position: 0 },
            { id: 'horse8', name: 'Mom / Me Tuan', position: 0 },
            { id: 'horse9', name: 'Owain', position: 0 },
            { id: 'horse10', name: 'Xuyen', position: 0 }
        ];

        let raceInterval;
        let raceActive = false;
        let racePaused = false;
        let raceCount = 0;
        let finishOrder = [];
        let standingsInterval;
        let savedRaceData = null;
        let isReplaying = false;
        const finishLine = 95;
        const raceSpeed = 50; // Milliseconds per frame (slower = longer race)

        // Load saved race on startup
        async function loadSavedRace() {
            try {
                const saved = await window.storage.get('saved-race', true);
                if (saved) {
                    savedRaceData = JSON.parse(saved.value);
                    document.getElementById('viewBtn').style.display = 'inline-block';
                    document.getElementById('raceLog').style.display = 'block';
                    document.getElementById('winner').textContent = 'Click "View Race" to see the results!';
                }
                
                const count = await window.storage.get('race-count', true);
                if (count) {
                    raceCount = parseInt(count.value);
                    document.getElementById('raceCount').textContent = raceCount;
                }
            } catch (error) {
                console.log('No saved race found');
                document.getElementById('winner').textContent = 'No race has been run yet. Contact admin to start the race!';
            }
        }

        loadSavedRace();

        function updateStandings() {
            const logDiv = document.getElementById('logEntries');
            
            const sortedHorses = [...horses].sort((a, b) => b.position - a.position);
            
            const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];
            
            logDiv.innerHTML = '';
            
            sortedHorses.forEach((horse, index) => {
                const entry = document.createElement('div');
                const isFinished = horse.position >= finishLine;
                entry.className = `log-entry ${isFinished ? 'finished' : ''}`;
                
                const distanceRemaining = Math.max(0, finishLine - horse.position).toFixed(1);
                const status = isFinished ? '✅ Finished!' : `${distanceRemaining}% to go`;
                
                entry.innerHTML = `
                    <div class="standing-place">${medals[index]} ${ordinals[index]}</div>
                    <div class="standing-name">${horse.name}</div>
                    <div class="standing-distance">${status}</div>
                `;
                
                logDiv.appendChild(entry);
            });
        }

        async function startRace() {
            if (raceActive) return;
            
            // If a saved race exists, always replay it instead of generating new
            if (savedRaceData) {
                viewRace();
                return;
            }
            
            // Only generate a new race if no saved race exists
            raceActive = true;
            racePaused = false;
            finishOrder = [];
            const raceMovements = [];
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('winner').textContent = '';
            document.getElementById('results').classList.remove('show');
            
            standingsInterval = setInterval(updateStandings, raceSpeed);

            raceInterval = setInterval(() => {
                if (racePaused) return;

                const movements = [];
                horses.forEach(horse => {
                    if (horse.position < finishLine) {
                        const randomMove = Math.random() * 1.5; // Reduced from 3 to make race longer
                        horse.position += randomMove;
                        movements.push({ id: horse.id, move: randomMove });

                        const horseElement = document.getElementById(horse.id);
                        horseElement.style.left = Math.min(horse.position, finishLine) + '%';

                        if (horse.position >= finishLine && !finishOrder.includes(horse)) {
                            finishOrder.push(horse);
                            
                            if (finishOrder.length === 1) {
                                racePaused = true;
                                document.getElementById('winner').textContent = `🏆 ${horse.name} wins! Race paused. Click Start to continue. 🏆`;
                            }
                        }
                    }
                });
                
                if (movements.length > 0) {
                    raceMovements.push(movements);
                }

                if (finishOrder.length === horses.length) {
                    clearInterval(raceInterval);
                    clearInterval(standingsInterval);
                    raceActive = false;
                    document.getElementById('startBtn').disabled = false;
                    displayResults();
                    raceCount++;
                    document.getElementById('raceCount').textContent = raceCount;
                    updateStandings();
                    
                    // Save race data
                    saveRace(raceMovements);
                }
            }, raceSpeed);
        }

        async function saveRace(movements) {
            savedRaceData = {
                movements: movements,
                finishOrder: finishOrder.map(h => ({ id: h.id, name: h.name }))
            };
            
            try {
                await window.storage.set('saved-race', JSON.stringify(savedRaceData), true);
                await window.storage.set('race-count', raceCount.toString(), true);
                document.getElementById('viewBtn').style.display = 'inline-block';
            } catch (error) {
                console.error('Could not save race:', error);
            }
        }

        async function viewRace() {
            if (!savedRaceData || raceActive) return;
            
            horses.forEach(horse => {
                horse.position = 0;
                document.getElementById(horse.id).style.left = '0%';
            });
            
            finishOrder = [];
            document.getElementById('winner').textContent = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('viewBtn').disabled = true;
            document.getElementById('raceLog').style.display = 'block';
            
            standingsInterval = setInterval(updateStandings, raceSpeed);
            
            let frame = 0;
            raceActive = true;
            raceInterval = setInterval(() => {
                if (frame >= savedRaceData.movements.length) {
                    clearInterval(raceInterval);
                    clearInterval(standingsInterval);
                    raceActive = false;
                    document.getElementById('viewBtn').disabled = false;
                    
                    // Reconstruct finish order
                    finishOrder = savedRaceData.finishOrder.map(h => 
                        horses.find(horse => horse.id === h.id)
                    );
                    
                    displayResults();
                    updateStandings();
                    document.getElementById('winner').textContent = `🏆 ${finishOrder[0].name} wins! 🏆`;
                    return;
                }
                
                const movements = savedRaceData.movements[frame];
                movements.forEach(move => {
                    const horse = horses.find(h => h.id === move.id);
                    if (horse && horse.position < finishLine) {
                        horse.position += move.move;
                        const horseElement = document.getElementById(horse.id);
                        horseElement.style.left = Math.min(horse.position, finishLine) + '%';
                        
                        if (horse.position >= finishLine && !finishOrder.includes(horse)) {
                            finishOrder.push(horse);
                        }
                    }
                });
                
                frame++;
            }, raceSpeed);
        }

        function displayResults() {
            const winner = finishOrder[0];

            const resultsDiv = document.getElementById('results');
            const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            const medals = ['🥇', '🥈', '🥉', '', '', '', '', '', '', ''];
            
            let resultsHTML = '<h2>Final Results</h2>';
            finishOrder.forEach((horse, index) => {
                const placeClass = index === 0 ? 'first' : index === 1 ? 'second' : index === 2 ? 'third' : '';
                resultsHTML += `
                    <div class="result-item ${placeClass}">
                        <div class="place">${medals[index]} ${ordinals[index]}</div>
                        <div class="horse-result-name">${horse.name}</div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = resultsHTML;
            resultsDiv.classList.add('show');
        }

        function resetRace() {
            clearInterval(raceInterval);
            clearInterval(standingsInterval);
            raceActive = false;
            racePaused = false;
            finishOrder = [];
            document.getElementById('winner').textContent = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('logEntries').innerHTML = '<div style="color: #666; font-style: italic; text-align: center;">Race not started yet...</div>';

            horses.forEach(horse => {
                horse.position = 0;
                document.getElementById(horse.id).style.left = '0%';
            });
        }

        async function adminPanel() {
            const password = prompt('Enter admin password:');
            if (password === 'santa2024') {
                const action = confirm('Choose an action:\n\nOK = Start New Race\nCancel = Reset All Data');
                
                if (action) {
                    // Start new race
                    if (savedRaceData) {
                        const confirmOverwrite = confirm('A race already exists. This will create a NEW race and overwrite the existing one. Continue?');
                        if (!confirmOverwrite) return;
                    }
                    resetRace();
                    startRace();
                } else {
                    // Reset all data
                    const confirmReset = confirm('This will delete all race data. Are you sure?');
                    if (!confirmReset) return;
                    
                    try {
                        await window.storage.delete('saved-race', true);
                        await window.storage.set('race-count', '0', true);
                        raceCount = 0;
                        document.getElementById('raceCount').textContent = '0';
                        savedRaceData = null;
                        document.getElementById('viewBtn').style.display = 'none';
                        document.getElementById('raceLog').style.display = 'none';
                        resetRace();
                        document.getElementById('winner').textContent = 'All data reset. Start a new race from the admin panel.';
                        alert('All race data has been reset!');
                    } catch (error) {
                        console.error('Could not reset:', error);
                        alert('Reset failed. Please try again.');
                    }
                }
            } else if (password !== null) {
                alert('Incorrect password!');
            }
        }
    </script>
</body>
</html>
