<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Race Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .track {
            background: #90EE90;
            border: 3px solid #228B22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .lane {
            display: flex;
            align-items: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }
        .santa-name {
            width: 100px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .race-path {
            flex: 1;
            height: 40px;
            background: linear-gradient(to right, #fff 0%, #fff 98%, #ff4444 98%, #ff4444 100%);
            border: 2px solid #666;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .santa {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            transition: left 0.1s ease-out;
            will-change: left;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .winner-announcement {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 20px;
            min-height: 30px;
        }
        .results {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        .results.show {
            display: block;
        }
        .results h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .place {
            font-size: 24px;
            font-weight: bold;
            width: 60px;
            text-align: center;
        }
        .santa-result-name {
            flex: 1;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎅 Secret Santa Race Randomizer 🎅</h1>
        
        <div class="track" id="track"></div>

        </div>

        <div class="results" id="results"></div>

                    "move": 0.20961959545479725
                },
                {
                    "id": "santa6",
                    "move": 0.15024401302897802
                },
                {
                    "id": "santa7",
                    "move": 0.19087845214246113
                },
                {
                    "id": "santa8",
                    "move": 0.04427732886345338
                },
                {
                    "id": "santa9",
                    "move": 0.06869829379727571
                },
                {
                    "id": "santa10",
                    "move": 0.09218656668278123
                }
                ]
            ]
            };

        let santas = [];
        let raceInterval = null;
        let isPlaying = false;
        const raceSpeed = 400;
        const goal = 3;

        function setupRace() {
            const santaNames = {
                'santa1': 'An',
                'santa2': 'Dad / Uncle Chris',
                'santa3': 'Dawson',
                'santa4': 'Donny',
                'santa5': 'Katherine',
                'santa6': 'Linda',
                'santa7': 'Maggie',
                'santa8': 'Mom / Me Tuan',
                'santa9': 'Owain',
                'santa10': 'Xuyen'
            };
            
            const firstRound = raceData.movements[0];
            santas = firstRound.map(m => ({
                id: m.id,
                name: santaNames[m.id] || m.id,
                position: 0
            }));

            const trackDiv = document.getElementById('track');
            trackDiv.innerHTML = '';

            santas.forEach(santa => {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="santa-name">${santa.name}</div>
                    <div class="race-path">
                        <div class="santa" id="${santa.id}">🎅</div>
                    </div>
                `;
                trackDiv.appendChild(lane);
            });
        }

        function viewRace() {
            if (isPlaying) return;
            
            // Reset positions
            santas.forEach(santa => {
                santa.position = 0;
                document.getElementById(santa.id).style.left = '0%';
            });
            
            isPlaying = true;
            document.getElementById('viewBtn').disabled = true;
            document.getElementById('winner').textContent = '';
            document.getElementById('results').classList.remove('show');
            
            let frame = 0;
            let raceFinished = false;

            raceInterval = setInterval(() => {
                if (frame >= raceData.movements.length || raceFinished) {
                    clearInterval(raceInterval);
                    isPlaying = false;
                    document.getElementById('viewBtn').disabled = false;
                    displayResults();
                    return;
                }
                
                const movements = raceData.movements[frame];
                movements.forEach(move => {
                    const santa = santas.find(s => s.id === move.id);
                    // Only move santa if they haven't crossed the finish line yet
                    if (santa && santa.position < goal) {
                        santa.position += move.move;
                        const santaElement = document.getElementById(santa.id);
                        const percentage = (santa.position / goal) * 95;
                        santaElement.style.left = Math.min(percentage, 95) + '%';
                        
                        // Check if this santa just crossed the finish line
                        if (santa.position >= goal && !raceFinished) {
                            raceFinished = true;
                        }
                    }
                });
                
                frame++;
            }, raceSpeed);
        }

        function displayResults() {
            // Sort santas by position (closest to finish line first)
            const sortedSantas = [...santas].sort((a, b) => b.position - a.position);
            
            const winner = sortedSantas[0];
            // document.getElementById('winner').textContent = `🏆 ${winner.name} wins! 🏆`;

            const resultsDiv = document.getElementById('results');
            const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            const medals = ['', '', '', '', '', '', '', '', '', ''];
            
            let resultsHTML = '<h2>Final Results</h2>';
            sortedSantas.forEach((santa, index) => {
                resultsHTML += `
                    <div class="result-item">
                        <div class="place">${medals[index]} ${ordinals[index]}</div>
                        <div class="santa-result-name">${santa.name}</div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = resultsHTML;
            resultsDiv.classList.add('show');
        }

        // Initialize race on page load
        setupRace();
    </script>
