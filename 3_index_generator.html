<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Race – Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .track {
            background: #90EE90;
            border: 3px solid #228B22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .lane {
            display: flex;
            align-items: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }
        .horse-name {
            width: 150px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .race-path {
            flex: 1;
            height: 40px;
            background: linear-gradient(to right, #fff 0%, #fff 98%, #ff4444 98%, #ff4444 100%);
            border: 2px solid #666;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .horse {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            transition: left 0.1s linear;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .winner-announcement {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 20px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎅 Secret Santa Race – OFFICIAL GENERATOR 🎅</h1>

        <div class="track" id="track">
            <div class="lane"><div class="horse-name">Andy</div><div class="race-path"><div class="horse" id="horse1">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Dad / Uncle Chris</div><div class="race-path"><div class="horse" id="horse2">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Dawson</div><div class="race-path"><div class="horse" id="horse3">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Donny</div><div class="race-path"><div class="horse" id="horse4">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Katherine</div><div class="race-path"><div class="horse" id="horse5">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Linda</div><div class="race-path"><div class="horse" id="horse6">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Maggie</div><div class="race-path"><div class="horse" id="horse7">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Mom / Me Tuan</div><div class="race-path"><div class="horse" id="horse8">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Owain</div><div class="race-path"><div class="horse" id="horse9">🎅</div></div></div>
            <div class="lane"><div class="horse-name">Xuyen</div><div class="race-path"><div class="horse" id="horse10">🎅</div></div></div>
        </div>

        <div class="controls">
            <button id="runBtn" onclick="startRace()">Run Official Race</button>
        </div>

        <div class="winner-announcement" id="winner"></div>
    </div>

    <script>
        const horses = [
            { id: 'horse1', name: 'Andy', position: 0 },
            { id: 'horse2', name: 'Dad / Uncle Chris', position: 0 },
            { id: 'horse3', name: 'Dawson', position: 0 },
            { id: 'horse4', name: 'Donny', position: 0 },
            { id: 'horse5', name: 'Katherine', position: 0 },
            { id: 'horse6', name: 'Linda', position: 0 },
            { id: 'horse7', name: 'Maggie', position: 0 },
            { id: 'horse8', name: 'Mom / Me Tuan', position: 0 },
            { id: 'horse9', name: 'Owain', position: 0 },
            { id: 'horse10', name: 'Xuyen', position: 0 }
        ];

        let raceInterval;
        let finishOrder = [];
        const finishLine = 95;
        const raceSpeed = 50;

        function startRace() {
            document.getElementById("runBtn").disabled = true;

            const raceMovements = [];

            raceInterval = setInterval(() => {
                const movements = [];

                horses.forEach(horse => {
                    if (horse.position < finishLine) {
                        const randomMove = Math.random() * 1.5;
                        horse.position += randomMove;
                        movements.push({ id: horse.id, move: randomMove });

                        document.getElementById(horse.id).style.left =
                            Math.min(horse.position, finishLine) + '%';

                        if (horse.position >= finishLine && !finishOrder.includes(horse)) {
                            finishOrder.push(horse);
                        }
                    }
                });

                raceMovements.push(movements);

                if (finishOrder.length === horses.length) {
                    clearInterval(raceInterval);
                    declareWinner();

                    const savedRace = {
                        movements: raceMovements,
                        finishOrder: finishOrder.map(h => ({ id: h.id, name: h.name }))
                    };

                    console.log("★ COPY THIS BELOW ★");
                    console.log("OFFICIAL_RACE_DATA = " + JSON.stringify(savedRace, null, 2));
                }
            }, raceSpeed);
        }

        function declareWinner() {
            const winner = finishOrder[0];
            document.getElementById("winner").textContent =
                `🏆 ${winner.name} wins the official race!`;
        }
    </script>
</body>
</html>
